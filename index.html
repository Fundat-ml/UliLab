    <title>UliLab | Biología Molecular</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #071827;
            color: white;
            line-height: 1.6;
        }
        .card-link {
            display: inline-block;
            margin-top: 20px;
            color: #55e6c1;
            text-decoration: none;
            font-weight: bold;
        }

        .card-link:hover {
            color: #7ff5d6;
        }


        /* BARRA DE NAVEGACIÓN */

        nav {
            width: 100%;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #081d2d;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #55e6c1;
        }

        nav a {
            color: #dce8ee;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        nav a:hover {
            color: #55e6c1;
        }

        /* PORTADA */ 

               .hero {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 20px;
    
            background:
                radial-gradient(circle at 20% 30%, #0e4c5c 0%, transparent 35%),
                radial-gradient(circle at 80% 70%, #183f68 0%, transparent 35%),
                #071827;
            }


         .hero-tag {
            display: inline-block;
            padding: 8px 16px;
            margin-bottom: 25px;
            border: 1px solid rgba(85, 230, 193, 0.4);
            border-radius: 30px;
              color: #55e6c1;
            font-size: 13px;
                font-weight: bold;
             letter-spacing: 1px;
        }

         .hero-buttons {
             display: flex;
            justify-content: center;
               gap: 15px;
            flex-wrap: wrap;
        }

         .secondary-button {
            background: transparent;
            color: #55e6c1;
            border: 1px solid #55e6c1;
        }

        .secondary-button:hover {
            background: #55e6c1;
            color: #071827;
        }

        .hero-content {
              max-width: 850px;
        }



      
        .hero h1 {
            font-size: clamp(55px, 10vw, 100px);
            color: #55e6c1;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        .hero h2 {
            font-size: clamp(22px, 4vw, 38px);
            margin-bottom: 20px;
        }

        .hero p {
            color: #b9cbd4;
            font-size: 20px;
            max-width: 650px;
            margin: 0 auto 35px;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            background: #55e6c1;
            color: #071827;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-3px);
            background: #7ff5d6;
        }


        /* SECCIONES */

        section {
            padding: 80px 8%;
        }

        .section-title {
            text-align: center;
            font-size: 38px;
            margin-bottom: 15px;
        }

        .section-subtitle {
            text-align: center;
            color: #9fb4bf;
            max-width: 650px;
            margin: 0 auto 50px;
        }

        /* TARJETAS */

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: #0d2638;
            padding: 30px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.07);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-7px);
            border-color: #55e6c1;
        }

        .card-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .card h3 {
            color: #55e6c1;
            margin-bottom: 10px;
        }

        .card p {
            color: #aebfc8;
        }

        /* SOBRE EL LABORATORIO */

        .about {
            background: #0a2030;
            text-align: center;
        }

        .about p {
            max-width: 800px;
            margin: auto;
            color: #c0d0d8;
            font-size: 18px;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 30px;
            background: #05131f;
            color: #78909c;
            font-size: 14px;
        }

        /* CELULAR */

        @media (max-width: 700px) {

    nav {
        flex-direction: column;
        gap: 15px;
        padding: 18px 5%;
    }

    .logo {
        font-size: 26px;
    }

    nav div:last-child {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
    }

    nav a {
        margin: 0;
        font-size: 14px;
    }

    .hero {
        min-height: 70vh;
        padding: 60px 20px;
    }

    .hero h1 {
        font-size: 60px;
    }

    .hero h2 {
        font-size: 24px;
    }

    .hero p {
        font-size: 17px;
    }

    section {
        padding: 60px 6%;
    }

    .section-title {
        font-size: 30px;
    }

    .section-subtitle {
        font-size: 16px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 25px;
    }

}
